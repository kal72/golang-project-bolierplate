syntax = "proto3";

package ping.v1;

option go_package = "golang-project-boilerplate/gen/ping";

service PingService {
  rpc Ping(PingRequest) returns (PingResponse);
}

message PingRequest {
  string message = 1;
}

message PingResponse {
  string message  = 1;
  string hostname = 2;
  int64  timestamp = 3;
}